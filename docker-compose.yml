services:
  omnimedia:
    build:
      context: .
      dockerfile: docker/Dockerfile
    container_name: omnimedia_app
    restart: unless-stopped
    ports:
      - "127.0.0.1:${PORT:-8000}:8000"
    env_file:
      - .env
    volumes:
      - omnimedia_uploads:/app/data/uploads
      - omnimedia_outputs:/app/data/outputs
      - omnimedia_temp:/app/data/temp
      - omnimedia_analytics:/app/data/analytics
    # Hardware acceleration devices passthrough (uncomment if GPU server)
    # devices:
    #   - /dev/dri:/dev/dri
    deploy:
      resources:
        limits:
          cpus: '4.0'
          memory: 4096M
        reservations:
          memory: 512M

  nginx:
    image: nginx:alpine
    container_name: omnimedia_proxy
    restart: unless-stopped
    profiles: ["production"]
    depends_on:
      - omnimedia
    ports:
      - "80:80"
    volumes:
      - ./docker/nginx.conf:/etc/nginx/nginx.conf:ro

volumes:
  omnimedia_uploads:
    driver: local
  omnimedia_outputs:
    driver: local
  omnimedia_temp:
    driver: local
  omnimedia_analytics:
    driver: local
